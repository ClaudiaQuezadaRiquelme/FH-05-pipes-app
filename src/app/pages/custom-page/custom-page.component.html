<section class="mx-5">
  <h1 class="text-2xl font-bold">Pipes Personalizados</h1>
  <h3 class="text-xl font-thin">Pipes creados por ti</h3>
</section>

<div class="stats shadow">
  <div class="stat">
    <div class="stat-title">ToggleCase Pipe</div>
    <div class="stat-value">nombre con pipe false: {{ name() | toggleCase: false }}</div>
    <div class="stat-value">nombre con pipe true: {{ name() | toggleCase: true }}</div>
    <div class="stat-desc">nombre sin pipe: {{ name() }}</div>

    <div class="stat-value">nombre pipe con toggle: {{ name() | toggleCase: toggle() }}</div>

    <button class="btn btn-primary" (click)="togglePlay()">ToogleCase</button>
  </div>
</div>
